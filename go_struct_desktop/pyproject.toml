[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go-struct-desktop"
version = "0.1.0b1"
description = "Desktop structural analysis workspace for GO Struct Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.scripts]
go-struct-desktop = "go_struct_desktop.app:main"
go-struct-beam = "go_struct_desktop.beam_workspace:main"
go-struct-truss = "go_struct_desktop.truss_workspace:main"
go-struct-warehouse = "go_struct_desktop.warehouse_workspace:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
gui = [
  "PySide6>=6.7",
]
build = [
  "PyInstaller>=6.10,<7",
]
warehouse-opensees = [
  "openseespy>=3.6",
]
warehouse-optimizer = [
  "pymoo>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
go_struct_desktop = ["assets/*.qml"]

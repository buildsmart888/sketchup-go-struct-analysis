[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go-struct-desktop"
version = "0.2.0"
description = "Desktop structural analysis workspace for GO Struct Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.scripts]
go-struct-desktop = "go_struct_desktop.app:main"
go-struct-beam = "go_struct_desktop.beam_workspace:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
gui = [
  "PySide6>=6.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

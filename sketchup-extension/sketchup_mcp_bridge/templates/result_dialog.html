<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{TITLE}}</title>
    <style>
      body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
      .wrap { padding: 20px; }
      h1 { margin: 0 0 16px; font-size: 24px; }
      h2 { margin: 24px 0 8px; font-size: 16px; }
      .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
      .kv { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 10px; }
      .label { font-size: 12px; color: #666; margin-bottom: 4px; text-transform: uppercase; }
      .value { font-size: 14px; word-break: break-word; }
      table { width: 100%; border-collapse: collapse; background: #fff; }
      th, td { border: 1px solid #ddd; padding: 8px; font-size: 12px; text-align: left; vertical-align: top; }
      th { background: #f0f0f0; position: sticky; top: 0; }
      .table-wrap { max-height: 420px; overflow: auto; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
      pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>{{TITLE}}</h1>
      {{RESULT_HTML}}
    </div>
  </body>
</html>

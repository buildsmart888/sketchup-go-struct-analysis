<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GO Struct Analysis - GOBeam X Span</title>
    <style>
      :root {
        --ink: #172025;
        --muted: #66757d;
        --line: #dce4e7;
        --panel: #ffffff;
        --paper: #eef3f3;
        --graphite: #263236;
        --graphite-2: #344247;
        --go: #00a86b;
        --go-dark: #08764f;
        --positive: #48c987;
        --negative: #ef5d5d;
        --negative-dark: #be3f3f;
        --beam: #e7eef0;
        --load: #25515d;
        --shadow: rgba(25, 42, 47, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(38,50,54,0.05) 1px, transparent 1px),
          linear-gradient(180deg, rgba(38,50,54,0.05) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 14px;
      }
      button, input, select { font: inherit; }
      button {
        border: 1px solid #c7d2d5;
        background: #fff;
        color: var(--graphite);
        border-radius: 7px;
        min-height: 34px;
        padding: 6px 13px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
      }
      button:hover { border-color: var(--go); color: var(--go-dark); }
      button.primary {
        background: var(--go);
        color: #fff;
        border-color: var(--go);
        letter-spacing: 0.16em;
        min-width: 220px;
        text-transform: uppercase;
        box-shadow: 0 10px 24px rgba(0,168,107,0.24);
      }
      button.soft { background: #e8f7f1; color: var(--go-dark); border-color: #b9e6d4; }
      button.ghost { background: #f6f9f9; color: var(--graphite-2); }
      button.danger { background: #fff0f0; color: var(--negative-dark); border-color: #ffc4c4; }
      input, select {
        border: 1px solid #c9d4d7;
        background: #fff;
        color: var(--ink);
        border-radius: 7px;
        height: 32px;
        padding: 4px 9px;
      }
      input:focus, select:focus { outline: 2px solid rgba(0,168,107,0.16); border-color: var(--go); }
      input[type="number"] { text-align: right; }
      input[readonly] { background: #eef4f3; color: #344247; font-weight: 700; }
      .app { min-height: 100vh; padding: 14px 16px 18px; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 14px;
        background: var(--graphite);
        color: #fff;
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 12px 30px var(--shadow);
      }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; }
      .go-mark {
        display: inline-grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 9px;
        background: var(--go);
        color: #fff;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .brand-title { display: flex; flex-direction: column; gap: 2px; }
      .brand-title small { color: #b7c5c9; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
      .brand input { width: 102px; height: 34px; text-align: center; font-size: 17px; border-color: #53636a; background: #1b2529; color: #fff; }
      .toolbar { display: flex; flex-wrap: wrap; justify-content: flex-end; }
      .toolbar > * { margin-left: 8px; }
      .toolbar button { background: #f7fbfb; border-color: transparent; }
      .grid {
        display: flex;
        align-items: start;
      }
      aside { width: 430px; flex-shrink: 0; margin-right: 14px; }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        margin: 0 0 13px;
        padding: 15px 14px 14px;
        box-shadow: 0 8px 22px rgba(25,42,47,0.06);
      }
      legend {
        color: var(--graphite);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0 7px;
      }
      .row {
        display: flex;
        align-items: center;
        margin-bottom: 9px;
      }
      .row > label, .row > span:first-child { width: 120px; flex-shrink: 0; margin-right: 8px; }
      .row > input, .row > select { flex: 1; min-width: 0; }
      .row > .unit { width: 62px; flex-shrink: 0; margin-left: 8px; }
      .row.compact > *:nth-child(2) { flex: 0 0 58px; margin-right: 8px; }
      .row.factor > *:nth-child(2) { flex: 0 0 112px; margin-right: 8px; }
      .row:last-child { margin-bottom: 0; }
      .actions { display: flex; align-items: center; flex-wrap: wrap; }
      .actions > * { margin-right: 8px; }
      .analyze { text-align: center; margin: 24px 0 4px; }
      .stage {
        flex: 1; min-width: 0;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fff;
        min-height: 720px;
        box-shadow: 0 12px 30px rgba(25,42,47,0.08);
        overflow: hidden;
      }
      .tabs {
        display: flex;
        padding: 10px 12px 0;
        background: #f7faf9;
        border-bottom: 1px solid var(--line);
      }
      .tabs > * { margin-right: 6px; }
      .tab {
        background: var(--graphite);
        border-color: var(--graphite);
        border-radius: 8px 8px 0 0;
        color: #fff;
        padding: 9px 18px;
        min-height: 38px;
      }
      .tab.inactive { color: #607177; background: #e8eeee; border-color: #e8eeee; }
      .canvas-area { padding: 14px 18px 18px; }
      .diagram { width: 100%; min-height: 192px; margin-bottom: 16px; }
      .diagram.large { min-height: 245px; }
      .diagram svg { width: 100%; height: 100%; display: block; }
      .tag {
        display: inline-block;
        border: 1px solid #444;
        background: #fff;
        padding: 2px 8px;
        font-weight: 900;
        letter-spacing: 0.26em;
      }
      .load-tag { color: var(--red); letter-spacing: 0; }
      .shear-tag { color: var(--green); }
      .moment-tag { color: var(--blue); }
      .defl-tag { color: #006e9c; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid var(--line); padding: 6px 7px; text-align: left; vertical-align: middle; }
      th { background: #eef4f3; color: #34404d; font-size: 12px; }
      td input { width: 100%; }
      .load-table { margin-top: 8px; table-layout: fixed; width: 100%; }
      .load-table th, .load-table td { padding: 5px 6px; }
      .load-table input, .load-table select { height: 30px; padding: 3px 7px; width: 100%; box-sizing: border-box; }
      .load-table button.danger { min-width: 52px; padding: 4px 7px; }

      .point-table th:nth-child(1), .point-table td:nth-child(1) { width: 84px; }
      .point-table th:nth-child(2), .point-table td:nth-child(2) { width: 68px; }
      .point-table th:nth-child(3), .point-table td:nth-child(3) { width: 110px; }
      .point-table th:nth-child(4), .point-table td:nth-child(4) { width: 64px; }

      .uniform-table th:nth-child(1), .uniform-table td:nth-child(1) { width: 74px; }
      .uniform-table th:nth-child(2), .uniform-table td:nth-child(2) { width: 58px; }
      .uniform-table th:nth-child(3), .uniform-table td:nth-child(3) { width: 58px; }
      .uniform-table th:nth-child(4), .uniform-table td:nth-child(4) { width: 80px; }
      .uniform-table th:nth-child(5), .uniform-table td:nth-child(5) { width: 64px; }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(130px, 1fr));
        gap: 8px;
        margin-bottom: 14px;
      }
      .metric { border: 1px solid var(--line); padding: 10px; background: #fbfdfc; border-radius: 8px; border-left: 4px solid var(--go); }
      .metric b { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
      pre {
        margin: 0;
        white-space: pre-wrap;
        font-family: Consolas, "Courier New", monospace;
        line-height: 1.45;
        max-height: 575px;
        overflow: auto;
        border: 1px solid var(--line);
        background: #fbfdfc;
        padding: 12px;
      }
      .status { margin-top: 10px; color: var(--muted); min-height: 20px; }
      .status.ok { color: var(--green); }
      .status.bad { color: var(--red); }
      .muted { color: var(--muted); }
      @media (max-width: 1050px) {
        .grid { grid-template-columns: 1fr; }
        .summary { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <script id="model-json" type="application/json">{{MODEL_JSON}}</script>
    <script id="result-json" type="application/json">{{RESULT_JSON}}</script>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <span class="go-mark">GO</span>
          <span class="brand-title">
            <span>GOBeam X Span V.1.0.4.0</span>
            <small>GO Struct Analysis / ผู้พัฒนา Phornjed Phongmanee</small>
          </span>
          <span>Beam</span>
          <input id="beamName" type="text">
        </div>
        <div class="toolbar">
          <button onclick="sendAction('gobeamLoad', {})">Load</button>
          <button onclick="saveBeam()">Save</button>
          <button onclick="sendAction('gobeamDraw3D', model)">Draw 3D</button>
          <button onclick="sendAction('gobeamDrawHUD', model)">Draw HUD</button>
          <button onclick="setTab('all')">Main</button>
          <button onclick="openReport()">Report</button>
        </div>
      </div>

      <div class="grid">
        <aside>
          <fieldset>
            <legend>Beam</legend>
            <div class="row compact">
              <label>Span Number</label>
              <strong id="spanCount">0</strong>
              <div class="actions">
                <button class="soft" onclick="addSpan()">Add Span</button>
                <button class="soft" onclick="deleteSpan()">Delete Span</button>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Project</legend>
            <div class="row"><label>Project</label><input id="project" type="text"><span></span></div>
            <div class="row"><label>Company</label><input id="company" type="text"><span></span></div>
            <div class="row"><label>Engineer</label><input id="engineer" type="text"><span></span></div>
            <div class="row"><label>Location</label><input id="location" type="text"><span></span></div>
          </fieldset>

          <fieldset>
            <legend>Analysis</legend>

            <div class="row">
              <label>Combination</label>
              <select id="activeCombination" onchange="updateActiveCombination(this.value)"></select>
              <span></span>
            </div>
            <div class="row factor">
              <label>DL Factor</label>
              <input id="factorDL" type="number" step="0.01" oninput="updateLoadFactor('DL', this.value)">
              <span>Dead</span>
            </div>
            <div class="row factor">
              <label>LL Factor</label>
              <input id="factorLL" type="number" step="0.01" oninput="updateLoadFactor('LL', this.value)">
              <span>Live</span>
            </div>
            <div class="muted" id="combinationText"></div>
          </fieldset>

          <fieldset>
            <legend>Span</legend>
            <div class="row">
              <label>Span :</label>
              <select id="spanSelect" onchange="selectSpan(Number(this.value))"></select>
              <span></span>
            </div>
            <div class="actions">
              <button class="soft" onclick="addUniformLoad()">Add Uniform Load</button>
            </div>
            <table class="load-table uniform-table">
              <thead><tr><th>w kg/m</th><th>x1 m</th><th>x2 m</th><th>Case</th><th></th></tr></thead>
              <tbody id="uniformLoadRows"></tbody>
            </table>
            <div class="row">
              <label>Beam Span</label>
              <input id="spanLength" type="number" step="0.01" min="0.01" oninput="updateSelectedSpan()">
              <span>m</span>
            </div>
            <div class="row">
              <label>Material</label>
              <select id="spanMaterial" onchange="updateSpanMaterial(this.value)"></select>
              <span></span>
            </div>
            <div class="row">
              <label>E</label>
              <input id="spanE" type="number" step="1000000" min="1" oninput="updateSelectedSpan()">
              <span>kg/m2</span>
            </div>
            <div class="row">
              <label>Rect b</label>
              <input id="sectionB" type="number" step="0.01" min="0.001" oninput="updateSectionInput()">
              <span>m</span>
            </div>
            <div class="row">
              <label>Rect h</label>
              <input id="sectionH" type="number" step="0.01" min="0.001" oninput="updateSectionInput()">
              <span>m</span>
            </div>
            <div class="row">
              <label>I</label>
              <input id="spanI" type="number" step="0.000001" min="0.000000001" oninput="updateSelectedSpan()">
              <span>m4</span>
            </div>
            <div class="row">
              <label>EI</label>
              <input id="spanEi" type="number" readonly>
              <span>kg-m2</span>
            </div>
            <div class="actions">
              <button class="ghost" onclick="calculateRectI()">Calc I</button>
              <button class="soft" onclick="addPointLoad()">Add Point Load</button>
              <button class="ghost" onclick="setTab('span')">Span Detail</button>
            </div>
            <table class="load-table point-table">
              <thead><tr><th>P kg</th><th>x m</th><th>Case</th><th></th></tr></thead>
              <tbody id="pointLoadRows"></tbody>
            </table>
          </fieldset>

          <div class="analyze">
            <button class="primary" onclick="analyze()">Analyze</button>
          </div>
          <div id="status" class="status">Ready.</div>
        </aside>

        <main class="stage">
          <div class="tabs">
            <button id="tabAll" class="tab" onclick="setTab('all')">All Span</button>
            <button id="tabSpan" class="tab inactive" onclick="setTab('span')">Span 1</button>
            <button id="tabResult" class="tab inactive" onclick="setTab('result')">Result</button>
          </div>
          <section id="viewAll" class="canvas-area">
            <div id="allLoads" class="diagram large"></div>
            <div id="allShear" class="diagram"></div>
            <div id="allMoment" class="diagram"></div>
            <div id="allDeflection" class="diagram"></div>
          </section>
          <section id="viewSpan" class="canvas-area" style="display:none">
            <div id="spanLoads" class="diagram large"></div>
            <div id="spanShear" class="diagram"></div>
            <div id="spanMoment" class="diagram"></div>
            <div id="spanDeflection" class="diagram"></div>
          </section>
          <section id="viewResult" class="canvas-area" style="display:none">
            <div id="summary" class="summary"></div>
            <pre id="calculationText"></pre>
          </section>
        </main>
      </div>
    </div>

    <script>
      var model = JSON.parse(document.getElementById("model-json").textContent);
      var result = JSON.parse(document.getElementById("result-json").textContent);
      var selectedSpan = 0;
      var activeTab = "all";

      function numberValue(id, fallback) {
        var value = Number(document.getElementById(id).value);
        return isFinite(value) ? value : fallback;
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function sendAction(action, payload) {
        gobeamSetStatus("Working...", true);
        var json = JSON.stringify(payload || {});
        if (window.sketchup && window.sketchup[action]) {
          window.sketchup[action](json);
        } else {
          window.location = "skp:" + action + "@" + encodeURIComponent(json);
        }
      }

      function gobeamSetStatus(message, ok) {
        var el = document.getElementById("status");
        el.textContent = message || "";
        el.className = "status " + (ok ? "ok" : "bad");
      }

      function gobeamReceiveAnalysis(nextResult) {
        result = nextResult;
        if (nextResult && nextResult.model) model = nextResult.model;
        gobeamSetStatus("Analysis complete.", true);
        render();
      }

      function gobeamReceiveModel(nextModel, nextResult) {
        model = nextModel;
        result = nextResult;
        selectedSpan = 0;
        activeTab = "all";
        render();
      }

      function analyze() {
        syncProject();
        sendAction("gobeamAnalyze", model);
      }

      function saveBeam() {
        syncProject();
        sendAction("gobeamSave", model);
      }

      function openReport() {
        syncProject();
        sendAction("gobeamReport", model);
      }

      function syncProject() {
        model.beamName = document.getElementById("beamName").value || "BM";
        model.projectInfo = model.projectInfo || {};
        model.projectInfo.project = document.getElementById("project").value || "Structure";
        model.projectInfo.company = document.getElementById("company").value || "";
        model.projectInfo.engineer = document.getElementById("engineer").value || "";
        model.projectInfo.location = document.getElementById("location").value || "";
        model.projectInfo.location = document.getElementById("location").value || "";
        var combo = activeCombination();
        if (combo && combo.name === "Custom") combo.method = model.projectInfo.designMethod;
      }

      function addSpan() {
        var last = normalizeSpanStiffness(model.spans[model.spans.length - 1] || defaultSpanStiffness());
        model.spans.push({
          name: "Span " + (model.spans.length + 1),
          lengthM: Number(last.lengthM) || 4,
          uniformLoads: last.uniformLoads ? JSON.parse(JSON.stringify(last.uniformLoads)) : [{ wKgM: 0, x1M: 0, x2M: 4, case: "DL" }],
          materialKey: last.materialKey || "Concrete",
          eKgM2: Number(last.eKgM2) || materialE("Concrete"),
          sectionShape: last.sectionShape || "Rectangle",
          sectionBM: Number(last.sectionBM) || 0.2,
          sectionHM: Number(last.sectionHM) || 0.4,
          iM4: Number(last.iM4) || rectI(0.2, 0.4),
          eiKgM2: Number(last.eiKgM2) || materialE("Concrete") * rectI(0.2, 0.4),
          pointLoads: []
        });
        selectedSpan = model.spans.length - 1;
        render();
        gobeamSetStatus("Span added. Press Analyze to update diagrams.", true);
      }

      function deleteSpan() {
        if (model.spans.length <= 1) {
          gobeamSetStatus("At least one span is required.", false);
          return;
        }
        model.spans.splice(selectedSpan, 1);
        selectedSpan = clamp(selectedSpan, 0, model.spans.length - 1);
        render();
        gobeamSetStatus("Span deleted. Press Analyze to update diagrams.", true);
      }

      function selectSpan(index) {
        selectedSpan = clamp(index, 0, model.spans.length - 1);
        render();
      }

      function updateSelectedSpan() {
        var span = model.spans[selectedSpan];
        if (!span) return;
        span.lengthM = Math.max(numberValue("spanLength", span.lengthM), 0.01);
        span.uniformLoads = (span.uniformLoads || []).map(function(load) {
          var x1 = clamp(Number(load.x1M) || 0, 0, span.lengthM);
          var x2 = clamp(Number(load.x2M) || span.lengthM, 0, span.lengthM);
          if (x1 > x2) { var t = x1; x1 = x2; x2 = t; }
          return { wKgM: Math.max(Number(load.wKgM) || 0, 0), x1M: x1, x2M: x2, case: load.case || "DL" };
        });
        span.materialKey = document.getElementById("spanMaterial").value || span.materialKey || "Concrete";
        span.eKgM2 = Math.max(numberValue("spanE", span.eKgM2 || materialE(span.materialKey)), 1);
        span.sectionShape = "Rectangle";
        span.sectionBM = Math.max(numberValue("sectionB", span.sectionBM || 0.2), 0.001);
        span.sectionHM = Math.max(numberValue("sectionH", span.sectionHM || 0.4), 0.001);
        span.iM4 = Math.max(numberValue("spanI", span.iM4 || ((span.eiKgM2 || 8000000) / span.eKgM2)), 0.000000001);
        span.eiKgM2 = Math.max(span.eKgM2 * span.iM4, 1);
        document.getElementById("spanEi").value = fmt(span.eiKgM2, 3);
        span.pointLoads = (span.pointLoads || []).map(function(load) {
          return { pKg: Math.max(Number(load.pKg) || 0, 0), xM: clamp(Number(load.xM) || 0, 0.0001, span.lengthM - 0.0001), case: load.case || "DL" };
        });
        renderUniformLoads();
        renderPointLoads();
      }

      function updateSpanMaterial(value) {
        var span = model.spans[selectedSpan];
        if (!span) return;
        span.materialKey = value || "Concrete";
        span.eKgM2 = materialE(span.materialKey);
        span.iM4 = Math.max(Number(span.iM4) || ((Number(span.eiKgM2) || 8000000) / span.eKgM2), 0.000000001);
        span.eiKgM2 = Math.max(span.eKgM2 * span.iM4, 1);
        document.getElementById("spanE").value = fmt(span.eKgM2, 3);
        document.getElementById("spanI").value = fmt(span.iM4, 8);
        document.getElementById("spanEi").value = fmt(span.eiKgM2, 3);
        gobeamSetStatus("Material changed. Press Analyze to update diagrams.", true);
      }

      function updateSectionInput() {
        var span = model.spans[selectedSpan];
        if (!span) return;
        span.sectionShape = "Rectangle";
        span.sectionBM = Math.max(numberValue("sectionB", span.sectionBM || 0.2), 0.001);
        span.sectionHM = Math.max(numberValue("sectionH", span.sectionHM || 0.4), 0.001);
      }

      function calculateRectI() {
        var span = model.spans[selectedSpan];
        if (!span) return;
        updateSectionInput();
        span.iM4 = rectI(span.sectionBM, span.sectionHM);
        span.eKgM2 = Math.max(numberValue("spanE", span.eKgM2 || materialE(span.materialKey)), 1);
        span.eiKgM2 = Math.max(span.eKgM2 * span.iM4, 1);
        document.getElementById("spanI").value = fmt(span.iM4, 8);
        document.getElementById("spanEi").value = fmt(span.eiKgM2, 3);
        gobeamSetStatus("I calculated from rectangle b*h^3/12. Press Analyze to update diagrams.", true);
      }

      function addPointLoad() {
        var span = model.spans[selectedSpan];
        span.pointLoads = span.pointLoads || [];
        span.pointLoads.push({ pKg: 1000, xM: Math.max(0.1, span.lengthM / 2), case: span.uniformLoadCase || "DL" });
        renderPointLoads();
        gobeamSetStatus("Point load added. Press Analyze to update diagrams.", true);
      }

      function updatePointLoad(index, key, value) {
        var span = model.spans[selectedSpan];
        var load = span.pointLoads[index];
        load[key] = key === "case" ? value : Number(value) || 0;
        if (key === "pKg") load.pKg = Math.max(load.pKg, 0);
        if (key === "xM") load.xM = clamp(load.xM, 0.0001, span.lengthM - 0.0001);
      }

      function updateActiveCombination(value) {
        model.activeCombination = value || "1.0DL";
        var combo = activeCombination();
        if (combo && combo.method) {
          model.projectInfo = model.projectInfo || {};
          model.projectInfo.designMethod = combo.method;
        }
        renderAnalysisControls();
        gobeamSetStatus("Combination changed. Press Analyze to update diagrams.", true);
      }

      function updateLoadFactor(caseName, value) {
        var combo = activeCombination();
        var number = Number(value);
        if (!isFinite(number)) number = 0;
        if (!combo || combo.name !== "Custom") {
          combo = ensureCustomCombination(combo);
          model.activeCombination = "Custom";
          document.getElementById("activeCombination").value = "Custom";
        }
        combo.factors = combo.factors || {};
        combo.factors[caseName] = number;
        document.getElementById("combinationText").textContent = combinationText(combo);
        gobeamSetStatus("Custom factor changed. Press Analyze to update diagrams.", true);
      }

      function ensureCustomCombination(sourceCombo) {
        model.loadCombinations = normalizeUiCombinations(model.loadCombinations);
        var custom = model.loadCombinations.filter(function(item) { return item.name === "Custom"; })[0];
        if (!custom) {
          custom = { name: "Custom", label: "Custom", method: "ASD", factors: { DL: 1, LL: 0 } };
          model.loadCombinations.push(custom);
        }
        if (sourceCombo && sourceCombo.name !== "Custom") {
          custom.method = sourceCombo.method || "ASD";
          custom.factors = {
            DL: comboFactor(sourceCombo, "DL"),
            LL: comboFactor(sourceCombo, "LL")
          };
        }
        return custom;
      }

      function deletePointLoad(index) {
        model.spans[selectedSpan].pointLoads.splice(index, 1);
        renderPointLoads();
      }

      function setTab(tab) {
        activeTab = tab;
        render();
      }

      function render() {
        var info = model.projectInfo || {};
        document.getElementById("beamName").value = model.beamName || "BM";
        document.getElementById("project").value = info.project || "";
        document.getElementById("company").value = info.company || "";
        document.getElementById("engineer").value = info.engineer || "";
        document.getElementById("location").value = info.location || "";
        renderAnalysisControls();
        document.getElementById("spanCount").textContent = model.spans.length;
        selectedSpan = clamp(selectedSpan, 0, model.spans.length - 1);

        var select = document.getElementById("spanSelect");
        select.innerHTML = model.spans.map(function(span, index) {
          return '<option value="' + index + '"' + (index === selectedSpan ? " selected" : "") + ">" + (index + 1) + " : L = " + fmt(span.lengthM, 2) + " m</option>";
        }).join("");

        var span = normalizeSpanStiffness(model.spans[selectedSpan]);
        document.getElementById("spanLength").value = span.lengthM;
        document.getElementById("spanMaterial").innerHTML = materialOptions(span.materialKey || "Concrete");
        document.getElementById("spanE").value = fmt(span.eKgM2, 3);
        document.getElementById("sectionB").value = fmt(span.sectionBM, 3);
        document.getElementById("sectionH").value = fmt(span.sectionHM, 3);
        document.getElementById("spanI").value = fmt(span.iM4, 8);
        document.getElementById("spanEi").value = fmt(span.eiKgM2, 3);
        document.getElementById("tabSpan").textContent = "Span " + (selectedSpan + 1);
        renderUniformLoads();
        renderPointLoads();
        renderTabs();
        renderDiagrams();
        renderResult();
      }
      function renderUniformLoads() {
        var span = model.spans[selectedSpan];
        var rows = (span.uniformLoads || []).map(function(load, index) {
          return '<tr><td><input type="number" step="0.01" min="0" value="' + escapeAttr(load.wKgM) + '" oninput="updateUniformLoad(' + index + ', \'wKgM\', this.value)"></td>' +
            '<td><input type="number" step="0.01" min="0" max="' + escapeAttr(span.lengthM) + '" value="' + escapeAttr(load.x1M) + '" oninput="updateUniformLoad(' + index + ', \'x1M\', this.value)"></td>' +
            '<td><input type="number" step="0.01" min="0" max="' + escapeAttr(span.lengthM) + '" value="' + escapeAttr(load.x2M) + '" oninput="updateUniformLoad(' + index + ', \'x2M\', this.value)"></td>' +
            '<td><select onchange="updateUniformLoad(' + index + ', \'case\', this.value)">' + caseOptions(load.case || "DL", true) + '</select></td>' +
            '<td><button class="danger" onclick="deleteUniformLoad(' + index + ')">Delete</button></td></tr>';
        }).join("");
        document.getElementById("uniformLoadRows").innerHTML = rows || '<tr><td colspan="5" class="muted">No uniform loads</td></tr>';
      }

      function addUniformLoad() {
        var span = model.spans[selectedSpan];
        span.uniformLoads = span.uniformLoads || [];
        span.uniformLoads.push({ wKgM: 1000, x1M: 0, x2M: span.lengthM, case: "DL" });
        renderUniformLoads();
        gobeamSetStatus("Uniform load added. Press Analyze to update diagrams.", true);
      }

      function updateUniformLoad(index, key, value) {
        var span = model.spans[selectedSpan];
        var load = span.uniformLoads[index];
        load[key] = key === "case" ? value : Number(value) || 0;
        if (key === "wKgM") load.wKgM = Math.max(load.wKgM, 0);
        if (key === "x1M" || key === "x2M") load[key] = clamp(load[key], 0, span.lengthM);
      }

      function deleteUniformLoad(index) {
        model.spans[selectedSpan].uniformLoads.splice(index, 1);
        renderUniformLoads();
      }

      function renderPointLoads() {
        var span = model.spans[selectedSpan];
        var rows = (span.pointLoads || []).map(function(load, index) {
          return '<tr><td><input type="number" step="0.01" min="0" value="' + escapeAttr(load.pKg) + '" oninput="updatePointLoad(' + index + ', \'pKg\', this.value)"></td>' +
            '<td><input type="number" step="0.01" min="0" max="' + escapeAttr(span.lengthM) + '" value="' + escapeAttr(load.xM) + '" oninput="updatePointLoad(' + index + ', \'xM\', this.value)"></td>' +
            '<td><select onchange="updatePointLoad(' + index + ', \'case\', this.value)">' + caseOptions(load.case || "DL", true) + '</select></td>' +
            '<td><button class="danger" onclick="deletePointLoad(' + index + ')">Delete</button></td></tr>';
        }).join("");
        document.getElementById("pointLoadRows").innerHTML = rows || '<tr><td colspan="4" class="muted">No point loads</td></tr>';
      }

      function renderAnalysisControls() {
        model.projectInfo = model.projectInfo || {};
        model.loadCases = defaultLoadCases();
        model.loadCombinations = normalizeUiCombinations(model.loadCombinations);
        model.activeCombination = model.activeCombination || model.loadCombinations[0].name;
        var combo = activeCombination();
        document.getElementById("activeCombination").innerHTML = model.loadCombinations.map(function(item) {
          return '<option value="' + escapeAttr(item.name) + '"' + (item.name === model.activeCombination ? " selected" : "") + ">" + (item.label || item.name) + "</option>";
        }).join("");
        document.getElementById("factorDL").value = fmtFactor(comboFactor(combo, "DL"));
        document.getElementById("factorLL").value = fmtFactor(comboFactor(combo, "LL"));
        document.getElementById("combinationText").textContent = combo ? combinationText(combo) : "";
      }

      function activeCombination() {
        var combos = model.loadCombinations || [];
        return combos.filter(function(item) { return item.name === model.activeCombination; })[0] || combos[0];
      }

      function combinationText(combo) {
        var factors = combo.factors || {};
        return ["DL", "LL"].map(function(name) { return fmt(factors[name] || 0, 3) + name; }).join(" + ");
      }

      function defaultLoadCases() {
        return [{ name: "DL", label: "Dead Load" }, { name: "LL", label: "Live Load" }];
      }

      function defaultCombinations() {
        return [
          { name: "1.0DL", label: "1.0DL [Service]", method: "ASD", factors: { DL: 1, LL: 0 } },
          { name: "1.0DL + 1.0LL", label: "1.0DL + 1.0LL [Service]", method: "ASD", factors: { DL: 1, LL: 1 } },
          { name: "1.4DL + 1.7LL", label: "1.4DL + 1.7LL [EIT / กฎกระทรวง]", method: "LRFD", factors: { DL: 1.4, LL: 1.7 } },
          { name: "1.2DL + 1.6LL", label: "1.2DL + 1.6LL [ACI / วสท. ใหม่]", method: "LRFD", factors: { DL: 1.2, LL: 1.6 } },
          { name: "Custom", label: "Custom", method: "ASD", factors: { DL: 1, LL: 0 } }
        ];
      }

      function normalizeUiCombinations(items) {
        var source = items || [];
        var customSource = source.filter(function(item) { return item && item.name === "Custom"; })[0];
        var list = defaultCombinations().map(function(item) {
          return { name: item.name, label: item.label, method: item.method, factors: { DL: item.factors.DL, LL: item.factors.LL } };
        });
        if (customSource) {
          var custom = list.filter(function(item) { return item.name === "Custom"; })[0];
          custom.method = customSource.method || custom.method;
          custom.factors = {
            DL: Number((customSource.factors || {}).DL) || 0,
            LL: Number((customSource.factors || {}).LL) || 0
          };
        }
        if (!list.filter(function(item) { return item.name === model.activeCombination; })[0]) {
          model.activeCombination = list[0].name;
        }
        return list;
      }

      function comboFactor(combo, caseName) {
        return Number((combo && combo.factors && combo.factors[caseName]) || 0);
      }

      function fmtFactor(value) {
        return fmt(value, 3);
      }

      function caseOptions(selected, compact) {
        return defaultLoadCases().map(function(item) {
          var name = item.name || item;
          var label = item.label || name;
          return '<option value="' + escapeAttr(name) + '"' + (name === selected ? " selected" : "") + ">" + (compact ? name : name + " - " + label) + "</option>";
        }).join("");
      }

      function defaultMaterials() {
        return [
          { key: "Concrete", label: "Concrete", eKgM2: 2100000000 },
          { key: "Steel", label: "Steel", eKgM2: 20400000000 },
          { key: "Aluminum", label: "Aluminum", eKgM2: 7100000000 },
          { key: "Custom", label: "Custom", eKgM2: 20400000000 }
        ];
      }

      function materialList() {
        return defaultMaterials();
      }

      function materialOptions(selected) {
        return materialList().map(function(item) {
          return '<option value="' + escapeAttr(item.key) + '"' + (item.key === selected ? " selected" : "") + ">" + item.label + "</option>";
        }).join("");
      }

      function materialE(key) {
        var material = materialList().filter(function(item) { return item.key === key; })[0] || materialList()[0];
        return Number(material.eKgM2) || 2100000000;
      }

      function rectI(b, h) {
        b = Math.max(Number(b) || 0.2, 0.001);
        h = Math.max(Number(h) || 0.4, 0.001);
        return b * Math.pow(h, 3) / 12;
      }

      function defaultSpanStiffness() {
        return {
          materialKey: "Concrete",
          eKgM2: materialE("Concrete"),
          sectionShape: "Rectangle",
          sectionBM: 0.2,
          sectionHM: 0.4,
          iM4: rectI(0.2, 0.4),
          eiKgM2: materialE("Concrete") * rectI(0.2, 0.4)
        };
      }

      function normalizeSpanStiffness(span) {
        span = span || {};
        span.materialKey = span.materialKey || "Concrete";
        span.eKgM2 = Number(span.eKgM2) > 0 ? Number(span.eKgM2) : materialE(span.materialKey);
        span.sectionShape = span.sectionShape || "Rectangle";
        span.sectionBM = Number(span.sectionBM) > 0 ? Number(span.sectionBM) : 0.2;
        span.sectionHM = Number(span.sectionHM) > 0 ? Number(span.sectionHM) : 0.4;
        span.eiKgM2 = Number(span.eiKgM2) > 0 ? Number(span.eiKgM2) : materialE("Concrete") * rectI(0.2, 0.4);
        span.iM4 = Number(span.iM4) > 0 ? Number(span.iM4) : span.eiKgM2 / span.eKgM2;
        span.eiKgM2 = Math.max(span.eKgM2 * span.iM4, 1);
        return span;
      }

      function renderTabs() {
        ["all", "span", "result"].forEach(function(tab) {
          document.getElementById("view" + cap(tab)).style.display = activeTab === tab ? "" : "none";
          document.getElementById("tab" + cap(tab)).className = "tab " + (activeTab === tab ? "" : "inactive");
        });
      }

      function renderDiagrams() {
        if (!result || !result.ok) return;
        var combo = result.activeCombination || activeCombination();
        var factorText = "";
        if (combo && combo.factors) {
          var factors = [];
          if (combo.factors.DL) factors.push(combo.factors.DL + "DL");
          if (combo.factors.LL) factors.push(combo.factors.LL + "LL");
          if (factors.length > 0) factorText = " (" + factors.join(" + ") + ")";
        }
        var labelText = "Factored Loadings" + factorText;

        var baseAllLoads = factoredAllSpanLoadData();
        drawLoads("allLoads", baseAllLoads, labelText);
        drawSeries("allShear", result.allSpanDiagrams.shear, "x", "v", "SFD", "shear", result.allSpanDiagrams.spanLabels);
        drawSeries("allMoment", result.allSpanDiagrams.moment, "x", "m", "BMD", "moment", result.allSpanDiagrams.spanLabels);
        drawSeries("allDeflection", result.allSpanDiagrams.deflection, "x", "dMm", "DEF", "defl", result.allSpanDiagrams.spanLabels);

        var span = result.spans[selectedSpan];
        var analysisSpan = (result && result.analysisModel && result.analysisModel.spans && result.analysisModel.spans[selectedSpan]) || model.spans[selectedSpan];
        if (span && analysisSpan) {
          var localData = {
            totalLengthM: span.lengthM,
            spanLabels: [{ x1: 0, x2: span.lengthM, label: "L = " + fmt(span.lengthM, 2) + " m" }],
            supports: [{ x: 0, reactionKg: span.reactions.leftKg }, { x: span.lengthM, reactionKg: span.reactions.rightKg }],
            loads: (analysisSpan.uniformLoads || []).map(function(load) {
              return { type: "uniform", x1: load.x1M, x2: load.x2M, wKgM: load.wKgM, case: load.case || "DL" };
            }).concat((analysisSpan.pointLoads || []).map(function(load) {
              return { type: "point", x: load.xM, pKg: load.pKg, case: load.case || "DL" };
            }))
          };
          drawLoads("spanLoads", localData, labelText);
          drawSeries("spanShear", span.shear, "x", "v", "SFD", "shear", localData.spanLabels);
          drawSeries("spanMoment", span.moment, "x", "m", "BMD", "moment", localData.spanLabels);
          drawSeries("spanDeflection", span.deflection, "x", "dMm", "DEF", "defl", localData.spanLabels);
        }
      }

      function factoredAllSpanLoadData() {
        var offset = 0;
        var loads = [];
        var spanLabels = [];
        var spans = (result && result.analysisModel && result.analysisModel.spans) || model.spans || [];
        spans.forEach(function(span) {
          var length = Number(span.lengthM) || 0;
          (span.uniformLoads || []).forEach(function(load) {
            loads.push({ type: "uniform", x1: offset + Number(load.x1M || 0), x2: offset + Number(load.x2M || length), wKgM: Number(load.wKgM) || 0, case: load.case || "DL" });
          });
          (span.pointLoads || []).forEach(function(load) {
            loads.push({ type: "point", x: offset + (Number(load.xM) || 0), pKg: Number(load.pKg) || 0, case: load.case || "DL" });
          });
          spanLabels.push({ x1: offset, x2: offset + length, label: fmt(length, 2) + " m", spanIndex: spanLabels.length });
          offset += length;
        });
        return {
          totalLengthM: offset || 1,
          loads: loads,
          supports: (result.allSpanDiagrams && result.allSpanDiagrams.supports) || [],
          spanLabels: spanLabels
        };
      }

      function renderResult() {
        if (!result || !result.summary) return;
        var s = result.summary;
        var combo = result.activeCombination || activeCombination() || {};
        document.getElementById("summary").innerHTML = [
          metric("Spans", s.spanCount),
          metric("Total length", fmt(s.totalLengthM, 3) + " m"),
          metric("Combination", combo.name || model.activeCombination || "1.0DL"),
          metric("Max +M", fmt(s.maxPositiveMomentKgM, 2) + " kg-m"),
          metric("Max deflection", fmt(s.maxAbsDeflectionMm, 3) + " mm")
        ].join("");
        document.getElementById("calculationText").textContent = result.calculationText || "";
      }

      function drawLoads(id, data, label) {
        var uniformLevels = [];
        (data.loads || []).forEach(function(load) {
          if (load.type === "uniform" && Number(load.wKgM) > 0) {
            var level = 0;
            uniformLevels.forEach(function(placed) {
              if (Math.max(load.x1, placed.x1) < Math.min(load.x2, placed.x2) - 1e-9) {
                if (placed.level >= level) level = placed.level + 1;
              }
            });
            load.level = level;
            uniformLevels.push({ x1: load.x1, x2: load.x2, level: level });
          }
        });
        var maxUniformLevel = 0;
        uniformLevels.forEach(function(u) { if (u.level > maxUniformLevel) maxUniformLevel = u.level; });
        var pointLoadShift = maxUniformLevel * 30;

        var w = 1000, addedHeight = pointLoadShift, h = 245 + addedHeight, pad = 72, y = 108 + addedHeight;
        var total = Math.max(Number(data.totalLengthM) || 1, 1);
        var sx = function(x) { return pad + (x / total) * (w - pad * 2); };
        var html = svgOpen(w, h);
        html += '<text x="' + (w - 130) + '" y="28" class="load-label">' + label + '</text>';
        html += '<line x1="' + sx(0) + '" y1="' + y + '" x2="' + sx(total) + '" y2="' + y + '" stroke="#111" stroke-width="2"/>';
        html += '<rect x="' + sx(0) + '" y="' + (y - 15) + '" width="' + (sx(total) - sx(0)) + '" height="15" fill="#e7eef0" stroke="#222"/>';
        (data.loads || []).forEach(function(load) {
          if (load.type === "uniform" && Number(load.wKgM) > 0) {
            var x1 = sx(load.x1), x2 = sx(load.x2);
            var uniformColor = loadCaseColor(load.case);
            var shift = (load.level || 0) * 30;
            html += '<line x1="' + x1 + '" y1="' + (y - 22 - shift) + '" x2="' + x2 + '" y2="' + (y - 22 - shift) + '" stroke="' + uniformColor + '" stroke-width="2"/>';
            for (var x = x1; x <= x2; x += 16) html += arrow(x, y - 32 - shift, x, y - 16 - shift, uniformColor);
            html += '<text x="' + clamp(x2 - 72, 8, w - 116) + '" y="' + (y - 36 - shift) + '" fill="' + uniformColor + '">' + fmt(load.wKgM, 0) + ' kg/m</text>';
          }
          if (load.type === "point") {
            var px = sx(load.x);
            var pointColor = loadCaseColor(load.case);
            html += arrow(px, y - 85 - pointLoadShift, px, y - 15, pointColor);
            html += '<text x="' + clamp(px - 34, 8, w - 92) + '" y="' + (y - 92 - pointLoadShift) + '" fill="' + pointColor + '">' + fmt(load.pKg, 0) + ' kg</text>';
          }
        });
        (data.supports || []).forEach(function(support) {
          var x = sx(support.x);
          html += '<polygon points="' + x + ',' + (y + 4) + ' ' + (x - 13) + ',' + (y + 35) + ' ' + (x + 13) + ',' + (y + 35) + '" fill="#dff5ec" stroke="#263236"/>';
          html += '<rect x="' + (x - 22) + '" y="' + (y + 35) + '" width="44" height="8" fill="#00a86b"/>';
          html += '<text x="' + clamp(x - 46, 8, w - 118) + '" y="' + (y + 58) + '" fill="#08764f">R = ' + fmt(support.reactionKg, 0) + ' kg</text>';
        });
        (data.spanLabels || []).forEach(function(span) {
          var x1 = sx(span.x1), x2 = sx(span.x2), ly = y + 62;
          html += '<line x1="' + x1 + '" y1="' + ly + '" x2="' + x2 + '" y2="' + ly + '" stroke="#111"/>';
          html += '<line x1="' + x1 + '" y1="' + (ly - 12) + '" x2="' + x1 + '" y2="' + (ly + 12) + '" stroke="#111"/>';
          html += '<line x1="' + x2 + '" y1="' + (ly - 12) + '" x2="' + x2 + '" y2="' + (ly + 12) + '" stroke="#111"/>';
          html += '<text x="' + ((x1 + x2) / 2 - 18) + '" y="' + (ly - 8) + '">' + span.label + '</text>';
        });
        html += "</svg>";
        document.getElementById(id).innerHTML = html;
      }

      function drawSeries(id, points, xKey, yKey, label, kind, spanLabels) {
        var w = 1000, h = 220, pad = 56;
        points = points || [];
        if (!points.length) { document.getElementById(id).innerHTML = ""; return; }
        var minX = Math.min.apply(null, points.map(function(p) { return Number(p[xKey]); }));
        var maxX = Math.max.apply(null, points.map(function(p) { return Number(p[xKey]); }));
        var maxAbs = Math.max.apply(null, points.map(function(p) { return Math.abs(Number(p[yKey])); }));
        maxAbs = Math.max(maxAbs, 1);
        var sx = function(x) { return pad + ((x - minX) / Math.max(maxX - minX, 1)) * (w - pad * 2); };
        var zero = h / 2;
        var sy = function(v) { return zero - (Number(v) / maxAbs) * (h * 0.32); };
        var unit = unitForKind(kind);
        var enhanced = pointsWithZeroCrossings(points, xKey, yKey);
        var line = points.map(function(p) { return sx(p[xKey]) + "," + sy(p[yKey]); }).join(" ");
        var html = svgOpen(w, h);
        html += '<text x="' + (w - 94) + '" y="28" class="' + kind + '-label">' + label + '</text>';
        html += seriesFillPolygons(enhanced, xKey, yKey, sx, sy, zero);
        html += '<line x1="' + pad + '" y1="' + zero + '" x2="' + (w - pad) + '" y2="' + zero + '" stroke="#263236" stroke-width="1.25"/>';
        html += '<polyline points="' + line + '" fill="none" stroke="#172025" stroke-width="2.2" stroke-linejoin="round"/>';
        html += minMaxLabels(points, xKey, yKey, sx, sy, spanLabels, unit, kind, pad, w);
        html += "</svg>";
        document.getElementById(id).innerHTML = html;
      }

      function pointsWithZeroCrossings(points, xKey, yKey) {
        var out = [];
        points.forEach(function(point, index) {
          var current = clonePoint(point, xKey, yKey);
          if (index === 0) {
            out.push(current);
            return;
          }
          var prev = clonePoint(points[index - 1], xKey, yKey);
          var x1 = Number(prev[xKey]), x2 = Number(current[xKey]);
          var y1 = Number(prev[yKey]), y2 = Number(current[yKey]);
          if (x2 !== x1 && y1 !== 0 && y2 !== 0 && ((y1 < 0 && y2 > 0) || (y1 > 0 && y2 < 0))) {
            var ratio = Math.abs(y1) / (Math.abs(y1) + Math.abs(y2));
            var zeroPoint = {};
            zeroPoint[xKey] = x1 + (x2 - x1) * ratio;
            zeroPoint[yKey] = 0;
            out.push(zeroPoint);
          }
          out.push(current);
        });
        return out;
      }

      function clonePoint(point, xKey, yKey) {
        var next = {};
        next[xKey] = Number(point[xKey]);
        next[yKey] = Number(point[yKey]);
        return next;
      }

      function seriesFillPolygons(points, xKey, yKey, sx, sy, zero) {
        var html = "";
        points.slice(0, -1).forEach(function(point, index) {
          var next = points[index + 1];
          var x1 = Number(point[xKey]), x2 = Number(next[xKey]);
          if (x1 === x2) return;
          var y1 = Number(point[yKey]), y2 = Number(next[yKey]);
          var mid = (y1 + y2) / 2;
          if (mid === 0) mid = y1 || y2;
          if (mid === 0) return;
          var fill = mid > 0 ? "#b8e8cd" : "#f4b6b6";
          var polygon = [
            sx(x1) + "," + zero,
            sx(x1) + "," + sy(y1),
            sx(x2) + "," + sy(y2),
            sx(x2) + "," + zero
          ].join(" ");
          html += '<polygon points="' + polygon + '" fill="' + fill + '" stroke="none"/>';
        });
        return html;
      }

      function minMaxLabels(points, xKey, yKey, sx, sy, spanLabels, unit, kind, pad, width) {
        var ranges = (spanLabels && spanLabels.length) ? spanLabels : [{ x1: points[0][xKey], x2: points[points.length - 1][xKey], label: "" }];
        var eps = kind === "defl" ? 0.0005 : 0.05;
        var html = "";
        ranges.forEach(function(range, index) {
          var start = Number(range.x1);
          var end = Number(range.x2);
          var lastRange = index === ranges.length - 1;
          var candidates = points.filter(function(point) {
            if (range.spanIndex !== undefined && point.spanIndex !== undefined) {
              return Number(point.spanIndex) === Number(range.spanIndex);
            }
            var x = Number(point[xKey]);
            return x >= start - 1e-9 && x <= end + 1e-9;
          });
          if (!candidates.length) return;
          var maxPoint = candidates.reduce(function(a, b) { return Number(a[yKey]) > Number(b[yKey]) ? a : b; });
          var minPoint = candidates.reduce(function(a, b) { return Number(a[yKey]) < Number(b[yKey]) ? a : b; });
          if (Number(maxPoint[yKey]) > eps) html += extremumLabel(maxPoint, "MAX", xKey, yKey, sx, sy, unit, kind, true, pad, width, index, range);
          if (Number(minPoint[yKey]) < -eps) html += extremumLabel(minPoint, "MIN", xKey, yKey, sx, sy, unit, kind, false, pad, width, index, range);
        });
        return html;
      }

      function extremumLabel(point, label, xKey, yKey, sx, sy, unit, kind, positive, pad, width, index, range) {
        var minLabelX = pad;
        var maxLabelX = width - 118;
        if (range && isFinite(Number(range.x1)) && isFinite(Number(range.x2))) {
          var rangeLeft = sx(Number(range.x1)) + 4;
          var rangeRight = sx(Number(range.x2)) - 118;
          if (rangeRight > rangeLeft) {
            minLabelX = Math.max(minLabelX, rangeLeft);
            maxLabelX = Math.min(maxLabelX, rangeRight);
          }
        }
        var x = clamp(sx(point[xKey]) - 46, minLabelX, Math.max(minLabelX, maxLabelX));
        var y = clamp(sy(point[yKey]) + (positive ? -18 - ((index % 2) * 11) : 24 + ((index % 2) * 11)), 18, 206);
        var color = positive ? "#08764f" : "#be3f3f";
        var value = fmt(point[yKey], kind === "defl" ? 3 : 0);
        return '<g><circle cx="' + sx(point[xKey]) + '" cy="' + sy(point[yKey]) + '" r="3.5" fill="' + color + '"/>' +
          '<text x="' + x + '" y="' + y + '" fill="' + color + '" class="extreme-label">' + label + ' ' + value + ' ' + unit + '</text></g>';
      }

      function loadCaseColor(caseName) {
        var colors = {
          DL: "#25515d",
          LL: "#0b8f6f"
        };
        return colors[caseName] || colors.DL;
      }

      function unitForKind(kind) {
        if (kind === "moment") return "kg-m";
        if (kind === "defl") return "mm";
        return "kg";
      }

      function svgOpen(w, h) {
        return '<svg viewBox="0 0 ' + w + " " + h + '" xmlns="http://www.w3.org/2000/svg" style="-webkit-print-color-adjust:exact;print-color-adjust:exact">' +
          '<style>text{font:18px Segoe UI,Tahoma,sans-serif;fill:#172025}.load-label{fill:#25515d;font-weight:900;letter-spacing:1px}.shear-label,.moment-label,.defl-label{fill:#263236;font-weight:900;letter-spacing:5px}.extreme-label{font-size:13px;font-weight:900;letter-spacing:.6px}</style>';
      }

      function arrow(x1, y1, x2, y2, color) {
        return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="3"/>' +
          '<polygon points="' + x2 + ',' + y2 + ' ' + (x2 - 6) + ',' + (y2 - 12) + ' ' + (x2 + 6) + ',' + (y2 - 12) + '" fill="' + color + '"/>';
      }

      function metric(label, value) { return '<div class="metric"><b>' + label + '</b>' + value + '</div>'; }
      function cap(text) { return text.charAt(0).toUpperCase() + text.slice(1); }
      function fmt(value, digits) {
        var number = Number(value);
        if (!isFinite(number)) return "0";
        if (!digits) return String(Math.round(number));
        return number.toFixed(digits).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      }
      function escapeAttr(value) { return String(value).replace(/"/g, "&quot;"); }

      render();
    </script>
  </body>
</html>
